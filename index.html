<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cruscotto">
<meta name="theme-color" content="#ffffff">
<title>Cruscotto PS Company</title>
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna stretta pensata per il telefono, caselle impilate; sul Mac la stessa colonna più larga. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eef1f4; --line:#dfe4ea;
  --ink:#121820; --ink-2:#4a5562; --ink-3:#7a8592;
  --accent:#2a78d6; --accent-soft:#e3eefb; --mark:#eb6834;
  --good:#0a7d0a; --bad:#c23131; --warn-bg:#fdf0d6; --warn-ink:#7a5200;
  --bad-bg:#fbe5e5; --good-bg:#e2f3e2;
  --banner-bg:#121820; --banner-ink:#f4f6f8;
  --f-text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#191d21; --sunk:#14181b; --line:#2b3238;
  --ink:#eef1f4; --ink-2:#b2bcc6; --ink-3:#86919c;
  --accent:#4f95ea; --accent-soft:#1c2b3d; --mark:#e9733f;
  --good:#3fbf3f; --bad:#ef6b6b; --warn-bg:#3a2e12; --warn-ink:#f2c65a;
  --bad-bg:#3b1f1f; --good-bg:#16301a;
  --banner-bg:#eef1f4; --banner-ink:#111417;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#191d21; --sunk:#14181b; --line:#2b3238;
  --ink:#eef1f4; --ink-2:#b2bcc6; --ink-3:#86919c;
  --accent:#4f95ea; --accent-soft:#1c2b3d; --mark:#e9733f;
  --good:#3fbf3f; --bad:#ef6b6b; --warn-bg:#3a2e12; --warn-ink:#f2c65a;
  --bad-bg:#3b1f1f; --good-bg:#16301a;
  --banner-bg:#eef1f4; --banner-ink:#111417;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
@media (min-width:800px){body{font-size:16px}}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.banner{background:var(--banner-bg);color:var(--banner-ink);font-size:13px;letter-spacing:.02em;text-align:center;padding-block:5px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--ink-3)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-2);font-size:15px;font-weight:500;padding:8px 10px 10px;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:640px){nav.tabs{gap:0;justify-content:space-between}nav.tabs a{font-size:14px;padding:8px 5px 10px}}
/* Telefono: sei voci nella barra, quelle di due parole vanno a capo */
@media (max-width:480px){nav.tabs{gap:7px}nav.tabs a{font-size:13px;padding:7px 0 9px;flex:0 1 auto;min-width:0;white-space:normal;text-align:center;line-height:1.15;display:flex;align-items:center;justify-content:center}}

main{max-width:820px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{color:var(--ink-3);font-size:15px;margin-top:2px}
.back{font-size:15px;text-decoration:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding-block:4px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.box h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin:0 0 12px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);vertical-align:middle}

/* Clienti */
.clients{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.client{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.clients li:first-child .client{border-top:0}
.client .name{font-weight:600;font-size:19px}
.client .meta{font-size:14px;color:var(--ink-3)}
.client .val{font-size:26px;font-weight:600;text-align:right;line-height:1.1}
.client .trend{font-size:14px;text-align:right;display:flex;gap:4px;align-items:center;justify-content:flex-end}
.client .spark{grid-column:1/-1}
.client.off{opacity:.55;grid-template-columns:1fr auto;padding:12px 0}
.client.off .name{font-size:17px;font-weight:500}
.soon{font-size:13px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.up{color:var(--good)} .down-good{color:var(--good)} .dn{color:var(--bad)}

/* KPI riga */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .l{font-size:13px;color:var(--ink-2);line-height:1.25}
.kpi .v{font-size:24px;font-weight:600;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.readout{font-size:15px;color:var(--ink-2);min-height:22px;margin-bottom:4px}
.readout b{color:var(--ink);font-weight:600}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-text)}
.legend-mark{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-top:6px}
.legend-mark i{width:16px;height:16px;border-radius:50%;background:var(--mark);display:inline-block;color:#fff;font-style:normal;font-size:10px;line-height:16px;text-align:center;font-weight:700}
.pop{margin-top:10px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.pop h3{font-size:14px;margin:0 0 6px;font-weight:600}

/* Variazioni */
.camp{margin-top:14px}
.camp:first-of-type{margin-top:0}
.camp-h{font-size:15px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.camp-h span{font-weight:400;color:var(--ink-3);font-size:13px}
.var{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.var:last-child{border-bottom:0}
.var .d{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-top:2px}
.var .c{font-size:15.5px}
.var .m{grid-column:2;font-size:14px;color:var(--ink-2)}
.more{margin-top:10px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;width:100%}

/* Prossimi passi */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.steps li:last-child{border-bottom:0}
.due{flex:none;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.due.late{color:var(--bad)}

/* Caselle chiuse */
details.box{padding:0}
details.box>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary h2{margin:0}
details.box>summary::after{content:"+";font-size:20px;color:var(--ink-3);line-height:1}
details.box[open]>summary::after{content:"\2212"}
details.box .in{padding:0 16px 16px}
.sk{margin-top:12px}
.sk:first-child{margin-top:0}
.sk h3{font-size:15px;margin:0 0 4px;font-weight:600}
.sk ul{margin:0;padding-left:18px;font-size:15px}
.ph{font-size:14.5px;color:var(--ink-3);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

/* Campagne Naruto */
.camps{list-style:none;margin:0;padding:0}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.cmp[aria-pressed="true"]{background:var(--accent-soft)}
.cmp .n{font-weight:600;font-size:15.5px}
.cmp .o{font-size:13.5px;color:var(--ink-2)}
.cmp .cpr{font-size:20px;font-weight:600;text-align:right}
.cmp .x{font-size:13px;color:var(--ink-3);text-align:right}
.cmp.closed .n,.cmp.closed .cpr{color:var(--ink-3)}

/* Prima e dopo */
.before{font-size:14.5px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:12px;line-height:1.5}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.after{font-size:16px;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.after .d{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.propose{border:1px solid var(--accent);background:var(--accent-soft)}
.propose h2{color:var(--accent)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between}
.field input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.ok{margin-top:10px;font-size:14.5px;color:var(--good);font-weight:600}

/* Foglio A4 */
.sheet-wrap{background:var(--sunk);border-radius:10px;padding:12px}
.sheet{container-type:inline-size;width:100%;max-width:620px;margin:0 auto;aspect-ratio:210/297;background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.18);font-family:var(--f-text);overflow:hidden}
.sheet-in{padding:6cqw 6.5cqw;display:flex;flex-direction:column;gap:2.4cqw;height:100%}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.35cqw solid #111;padding-bottom:1.4cqw}
.sh-head b{font-size:4.2cqw;font-weight:700}
.sh-head span{font-size:2.3cqw;color:#555}
.sh-cols{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw 4cqw;align-content:start}
.sh-blk h4{margin:0 0 .8cqw;font-size:2.35cqw;text-transform:uppercase;letter-spacing:.06em;color:#111;border-bottom:.15cqw solid #bbb;padding-bottom:.5cqw;display:flex;justify-content:space-between}
.sh-blk h4 span{font-weight:400;color:#777;text-transform:none;letter-spacing:0}
.sh-blk ul{list-style:none;margin:0;padding:0}
.sh-blk li{font-size:2.15cqw;line-height:1.35;display:grid;grid-template-columns:2.4cqw 1fr auto;gap:0 1cqw;padding:.45cqw 0}
.sh-blk li::before{content:"";width:1.7cqw;height:1.7cqw;border:.2cqw solid #333;border-radius:.3cqw;margin-top:.25cqw}
.sh-blk li em{font-style:normal;font-family:var(--f-mono);font-size:1.8cqw;color:#666;white-space:nowrap}
.sh-blk li em.late{color:#b01e1e;font-weight:600}
.sh-pers{margin-top:auto;border-top:.35cqw dashed #999;padding-top:2cqw}
.sh-foot{font-size:1.7cqw;color:#888;display:flex;justify-content:space-between}

/* Posta e Automazioni */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-size:26px;font-weight:600;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .t{font-size:15.5px}
.rows .s{font-size:13.5px;color:var(--ink-3)}
.pill{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;align-self:start;white-space:nowrap}
.p-ok{background:var(--good-bg);color:var(--good)}
.p-err{background:var(--bad-bg);color:var(--bad)}
.p-wait{background:var(--sunk);color:var(--ink-2)}
.p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Pulsanti piccoli, toast */
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14.5px;font-weight:500;cursor:pointer;line-height:1.2}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.dng{color:var(--bad)}
.sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--banner-bg);color:var(--banner-ink);padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;width:max-content;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.22)}

/* In attesa */
.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.att li:last-child{border-bottom:0}
.att .gg{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap;align-self:baseline}
.att .wh{font-size:14px;color:var(--ink-2);min-width:0}
.att .wh b{font-weight:600;color:var(--ink)}
.att .sbtn{justify-self:end}
.attn{display:inline-block;font-size:12.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:3px;white-space:nowrap}
.tag.tass{background:var(--sunk);color:var(--ink-2)}
.steps li.coll>span:first-child{color:var(--ink-2)}
.who{font-weight:600}

/* Oggi: elenco */
.cli-blk{margin-top:16px}
.cli-blk:first-child{margin-top:0}
.cli-h{font-size:15px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.cli-h span{font-weight:400;color:var(--ink-3);font-size:13px;text-align:right}
.vos{list-style:none;margin:0;padding:0}
.vo{border-bottom:1px solid var(--line)}
.vo:last-child{border-bottom:0}
.vo-row{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:10px 0;cursor:pointer;font-size:16px}
.vo-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vo-row .tx{flex:1;min-width:0}
.vo.open{background:var(--sunk);border-radius:8px;margin-inline:-8px;padding-inline:8px;border-bottom-color:transparent}
.vo-act{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.acts,.pass{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pass>span{font-size:14px;color:var(--ink-2);margin-right:2px}
.mini-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini-form label{font-size:13.5px;color:var(--ink-2);width:100%}
.mini-form input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 180px;min-width:0}
.lab{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin:8px 0 -6px}
.sh-att{margin-top:auto;border-top:.35cqw dashed #999;padding-top:1.6cqw;font-size:2.15cqw;display:flex;flex-wrap:wrap;gap:.6cqw 3cqw;align-items:baseline}
.sh-att .k{font-size:2.15cqw;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sh-att b{font-weight:700}

/* Come funziona: disegno */
.dg-fig{margin:0;scroll-margin-top:110px}
.dg-wrap{max-width:500px;margin:0 auto}
.dg{display:block;width:100%;height:auto;font-family:var(--f-text)}
.dg g{transition:opacity .25s}
.dg .n rect{fill:var(--surface);stroke:var(--ink-3);stroke-width:1}
.dg .n .nl{fill:var(--ink);font-size:13px;font-weight:600}
.dg .n.c .nl{font-size:12.5px;font-weight:500}
.dg .n .ns{fill:var(--ink-3);font-size:11px}
.dg .n.dash rect{fill:none;stroke-dasharray:5 3}
.dg .ar line{stroke:var(--ink-3);stroke-width:1.3}
.dg .ar polygon{fill:var(--ink-3)}
.dg .ar text{fill:var(--ink-3);font-size:11px}
.dg .fr{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.dg .lg-bg{fill:var(--surface)}
.dg .lg{fill:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.08em}
.dg .sch{fill:var(--sunk)}
.dg .sch-l{fill:var(--ink-3);font-size:11px;font-weight:600}
.dg .pers rect{fill:none;stroke:var(--ink-3);stroke-dasharray:2 3}
.dg .pers .pl{fill:var(--ink-2);font-size:12.5px;font-weight:600}
.dg .pers .ps{fill:var(--ink-3);font-size:11px}
.dg.play .n:not(.on),.dg.play .ar:not(.on),.dg.play .bg{opacity:.22}
.dg .n.on rect{stroke:var(--accent);fill:var(--accent-soft);stroke-width:1.5}
.dg .n.now rect{stroke-width:2.6}
.dg .ar.on line{stroke:var(--accent);stroke-width:2.2}
.dg .ar.on polygon{fill:var(--accent)}
.dg .ar.on text{fill:var(--accent);font-weight:600}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nb nav" "tx tx";gap:4px 10px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:8px;min-height:70px}
.step .nb{grid-area:nb;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.step .nav{grid-area:nav;display:flex;gap:4px}
.step .nav button{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.step .nav button:disabled{opacity:.35;cursor:default}
.step .tx{grid-area:tx;font-size:16.5px;font-weight:500}
.step .tx.idle{color:var(--ink-3);font-weight:400}
.cap{font-size:13px;color:var(--ink-3);margin-top:8px;text-align:center}

<script>
/* Cruscotto di lavoro. Pagina pubblica senza dati: i dati stanno cifrati nell'archivio
   PaoloB91/cruscotto-lavoro-dati (GitHub Pages, stesso dominio). La password apre chiave.json,
   che contiene la chiave dati; la chiave si ricorda sul dispositivo se Paolo lo chiede.
   In locale, se dati/ non ha chiave.json, i dati si leggono in chiaro (anteprima).
   Sorgente: Sistema/cruscotto/lavoro/ del workspace. Regole: Sistema/cruscotto/CLAUDE.md. */
const LOCALE = location.protocol === "file:" || ["localhost","127.0.0.1"].includes(location.hostname);
const BASE = LOCALE ? "dati/" : "/cruscotto-lavoro-dati/";
const CHIAVE_LS = "cruscotto-lavoro-k";
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MESI_LUNGHI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];

/* ================= DATI ================= */
const D = {indice:null, clienti:{}, risultati:{}};
let OGGI = new Date().toISOString().slice(0,10);

/* La chiave dati si tiene in localStorage ("ricorda su questo dispositivo") o solo per la sessione. */
function leggiChiave(){
  try{ return localStorage.getItem(CHIAVE_LS) || sessionStorage.getItem(CHIAVE_LS) || ""; }catch(e){ return ""; }
}
function salvaChiave(v, ricorda){
  try{ localStorage.removeItem(CHIAVE_LS); sessionStorage.removeItem(CHIAVE_LS); }catch(e){}
  if(!v) return;
  try{ (ricorda ? localStorage : sessionStorage).setItem(CHIAVE_LS, v); }catch(e){ try{ sessionStorage.setItem(CHIAVE_LS, v); }catch(e2){} }
}
const b64d = s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const b64e = u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const url = rel=>BASE + rel + "?t=" + Date.now();

class ErroreChiave extends Error {}
let CIFRATO = null, CHIAVE_JSON = null, CHIAVE = null;
async function modo(){
  if(CIFRATO!==null) return;
  const r = await fetch(url("chiave.json"), {cache:"no-store"});
  if(r.ok){ CHIAVE_JSON = await r.json(); CIFRATO = true; }
  else if(r.status===404 && LOCALE) CIFRATO = false;
  else throw new Error(r.status===404 ? "archivio dati non ancora pubblicato" : "archivio dati: risposta "+r.status);
}
async function chiaveDati(){
  if(CHIAVE) return CHIAVE;
  const k = leggiChiave();
  if(!k) throw new ErroreChiave("manca");
  CHIAVE = await crypto.subtle.importKey("raw", b64d(k), "AES-GCM", false, ["encrypt","decrypt"]);
  return CHIAVE;
}
/* Stesso formato di strumenti/cifratura.py: iv di 12 byte, poi testo cifrato con il suo sigillo. */
/* esci=false: un file che non si decifra non scollega il dispositivo (Key Points), dà solo errore. */
async function decifraByte(b, esci=true){
  const k = await chiaveDati();
  try{ return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, k, b.slice(12))); }
  catch(e){ if(!esci) throw new Error("file illeggibile"); salvaChiave(""); CHIAVE = null; throw new ErroreChiave("cambiata"); }
}
async function cifraTesto(t){
  const k = await chiaveDati(), iv = crypto.getRandomValues(new Uint8Array(12));
  const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(t)));
  const out = new Uint8Array(12 + c.length); out.set(iv); out.set(c, 12); return out;
}
/* Password → chiave dati, con gli stessi parametri di strumenti/cifratura.py (PBKDF2-SHA256, AES-GCM). */
async function apriConPassword(pw){
  await modo();
  const j = CHIAVE_JSON;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(j.sale), iterations:j.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const k = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(j.iv)}, kek, b64d(j.k));
  return b64e(k);
}
async function leggi(rel, tipo="json"){
  await modo();
  let testo;
  if(!CIFRATO){
    const r = await fetch(url(rel), {cache:"no-store"});
    if(r.status===404) return null;
    if(!r.ok) throw new Error("archivio dati: risposta "+r.status);
    testo = await r.text();
  } else {
    await chiaveDati();
    const r = await fetch(url(rel+".cif"), {cache:"no-store"});
    if(r.status===404) return null;
    if(!r.ok) throw new Error("archivio dati: risposta "+r.status);
    testo = await decifraByte(new Uint8Array(await r.arrayBuffer()));
  }
  return tipo==="json" ? JSON.parse(testo) : testo;
}

async function caricaCliente(id){
  if(D.clienti[id]) return D.clienti[id];
  const c = await leggi(`clienti/${id}.json`);
  D.clienti[id] = c;
  if(c && c.risultati && !D.risultati[id]){
    const t = await leggi(c.risultati, "text");
    D.risultati[id] = t ? parseCSV(t) : [];
  }
  return c;
}

function parseCSV(t){
  const righe = t.trim().split(/\r?\n/).slice(1);
  return righe.map(r=>{
    const p = r.split(","); /* i nomi delle campagne non hanno virgole: sono quelli della piattaforma senza barre */
    const v = p.pop(), m = p.pop(), g = p.shift();
    return {g, c:p.join(","), m, v:+v};
  });
}

/* Totali mese per mese di una metrica, dal primo mese con dati al mese di oggi. */
function perMese(righe, metrica){
  const tot = {};
  righe.forEach(r=>{ if(r.m===metrica){ const k=r.g.slice(0,7); tot[k]=(tot[k]||0)+r.v; } });
  return tot;
}
function mesiDa(righe){
  if(!righe.length) return [];
  const primo = righe.reduce((a,r)=>r.g<a?r.g:a, righe[0].g).slice(0,7);
  const out = []; let [y,m] = primo.split("-").map(Number);
  const fine = OGGI.slice(0,7);
  while(true){ const k = `${y}-${String(m).padStart(2,"0")}`; out.push(k); if(k>=fine) break; m++; if(m>12){m=1;y++;} }
  return out;
}
const ultimoGiorno = righe=>righe.reduce((a,r)=>r.g>a?r.g:a, "");

/* ================= UTILITÀ ================= */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dm = iso=>iso.slice(8,10)+"/"+iso.slice(5,7);
const eur = (v,dec=0)=>v.toLocaleString("it-IT",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const css = n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const late = s=>s && s<OGGI;
const inArrivo = t=>`<div class="ph soon-box"><span>${t}</span><span class="soon">in arrivo</span></div>`;
const nomeMese = k=>MESI_LUNGHI[+k.slice(5,7)-1];
function dataLunga(iso){ const d=new Date(iso+"T12:00:00"); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI_LUNGHI[d.getMonth()].toLowerCase()}`; }

/* Le fonti di ogni casella sono scritte in Sistema/cruscotto/CLAUDE.md, non in pagina (scelta di Paolo del 2026-11-25). */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},2600); }

/* ================= GRAFICI ================= */
function scala(max){
  if(max<=0) return {max:1,ticks:[0,1]};
  const p = Math.pow(10, Math.floor(Math.log10(max))), passi=[1,2,2.5,5,10];
  let st = p; for(const s of passi){ if(max/(s*p)<=3){ st=s*p; break; } }
  const top = Math.ceil(max/st)*st, ticks=[]; for(let t=0;t<=top+1e-9;t+=st) ticks.push(+t.toFixed(6));
  return {max:top*1.08, ticks};
}
function barChart(el, vals, labels, opts){
  const W = Math.max(280, el.clientWidth), H = 210;
  const padL = 38, padR = 6, padT = 34, padB = 26;
  const iw = W-padL-padR, ih = H-padT-padB;
  const {max, ticks} = opts;
  const n = vals.length, slot = iw/n, bw = Math.min(30, slot*0.58);
  const y = v=>padT+ih-(v/max)*ih;
  const ink3 = css("--ink-3"), line = css("--line"), acc = css("--accent"), mark = css("--mark"), ink = css("--ink");
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.aria)}">`;
  ticks.forEach(t=>{ s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="${line}" stroke-width="1"/>`;
    s+=`<text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="${ink3}">${eur(t, t%1?1:0)}</text>`; });
  vals.forEach((v,i)=>{

function spark(el, vals){
  const v = vals.filter(x=>x!=null); if(v.length<2){ el.innerHTML=""; return; }
  const W = el.clientWidth||300, H = 30, n=v.length, max=Math.max(...v), min=Math.min(...v);
  const x=i=>2+i*(W-6)/(n-1), y=t=>H-3-(t-min)/((max-min)||1)*(H-8);
  const p = v.map((t,i)=>`${i?"L":"M"}${x(i)},${y(t)}`).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" width="100%" aria-hidden="true"><path d="${p}" fill="none" stroke="${css("--accent")}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(v[n-1])}" r="3" fill="${css("--accent")}"/></svg>`;
}
function arrow(dir){

}

/* Serie mensile di un KPI: null prima della data da cui il KPI è affidabile. */
function serieKpi(id, k){
  const righe = D.risultati[id]||[], mesi = mesiDa(righe), tot = perMese(righe, k.metrica);
  const dal = k.dal ? k.dal.slice(0,7) : null;
  const vals = mesi.map(m=> dal && m<dal ? null : (tot[m]||0));
  return {mesi, vals};
}
/* Ultimo mese chiuso e quello prima, per l'elenco clienti e le caselle in alto. */
function ultimoChiuso(mesi){ const cur = OGGI.slice(0,7); const i = mesi.lastIndexOf(cur); return i>0 ? i-1 : mesi.length-1; }
function fmtKpi(k, v){ if(v==null) return "n.d."; const dec = k.metrica==="conversioni" && v%1 ? 1 : 0; return eur(v,dec)+(k.unita?" "+k.unita:""); }

/* ---------- Key Points: appunti/<cliente>.json nell'archivio dati, cifrato. Li scrive solo Paolo, da qui.
   Per scrivere serve una chiave GitHub fine-grained limitata a cruscotto-lavoro-dati (Contents: lettura
   e scrittura), creata da Paolo. La incolla una volta: la pagina la deposita in scrittura.json, cifrata con
   la chiave dati, e ogni dispositivo aperto con la password la prende da lì. In anteprima locale i punti
   restano nel browser. */
const GH_LS = "cruscotto-lavoro-gh", GH_REPO = "PaoloB91/cruscotto-lavoro-dati", GH_FILE = "scrittura.json";
const KP_MAX = 5;
class ErroreGh extends Error {}
let ghScaduta = false;
function leggiGh(){ try{ return localStorage.getItem(GH_LS)||""; }catch(e){ return ""; } }
function salvaGh(v){ try{ v ? localStorage.setItem(GH_LS, v) : localStorage.removeItem(GH_LS); }catch(e){} }
async function prendiGh(){
  if(!CIFRATO || ghScaduta || leggiGh()) return;
  try{ const j = await leggi(GH_FILE); if(j && j.gh) salvaGh(j.gh); }catch(e){}
}
async function depositaGh(tok){
  const r0 = await ghApi(`/contents/${GH_FILE}.cif?ref=main`, {}, tok);
  const corpo = {message:"Chiave di scrittura del Cruscotto", branch:"main", content:b64e(await cifraTesto(JSON.stringify({gh:tok})+"\n"))};
  if(r0.ok) corpo.sha = (await r0.json()).sha;
  const r = await ghApi(`/contents/${GH_FILE}.cif`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corpo)}, tok);
  if(!r.ok) throw new Error(r.status===403 ? "La chiave non ha il permesso di scrittura (Contents: Read and write)" : "GitHub: risposta "+r.status);
}
function ghApi(path, opt={}, tok=leggiGh()){
  return fetch(`https://api.github.com/repos/${GH_REPO}${path}`, {...opt, cache:"no-store",
    headers:{Authorization:`Bearer ${tok}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opt.headers||{})}});
}
async function leggiAppunti(id){
  const rel = `appunti/${id}.json`;
  if(!CIFRATO){ try{ return {punti:JSON.parse(localStorage.getItem("cruscotto-anteprima-"+rel)||"[]")}; }catch(e){ return {punti:[]}; } }
  if(!leggiGh()) return (await leggi(rel)) || {punti:[]};
  /* Con la chiave si legge dall'API: sempre fresco, senza il minuto di ritardo delle Pages. */
  const r = await ghApi(`/contents/${rel}.cif?ref=main`);
  if(r.status===404) return {punti:[], sha:null};
  if(r.status===401 || r.status===403) throw new ErroreGh("chiave");
  if(!r.ok) throw new Error("GitHub: risposta "+r.status);
  const {sha} = await r.json();
  /* /contents (sia "content" sia il formato raw) non è affidabile per i file cifrati: GitHub a volte li prende
     per testo Latin-1 e li converte in UTF-8 (visto il 2026-11-25, 45 byte diventati 66). Il blob di git no. */
  const rr = await ghApi(`/git/blobs/${sha}`);
  if(!rr.ok) throw new Error("GitHub: risposta "+rr.status);
  const blob = await rr.json();
  return {...JSON.parse(await decifraByte(b64d(blob.content.replace(/\s/g,"")), false)), sha};
}
async function scriviAppunti(id, cambia){
  const rel = `appunti/${id}.json`;
  if(!CIFRATO){
    const punti = cambia((await leggiAppunti(id)).punti);
    try{ localStorage.setItem("cruscotto-anteprima-"+rel, JSON.stringify(punti)); }catch(e){}
    return {punti};
  }
  for(let tentativo=0; tentativo<3; tentativo++){
    const cur = await leggiAppunti(id), punti = cambia(cur.punti||[]);
    const corpo = {message:`Key Points ${id}`, branch:"main", content:b64e(await cifraTesto(JSON.stringify({punti}, null, 1)+"\n"))};
    if(cur.sha) corpo.sha = cur.sha;
    const r = await ghApi(`/contents/${rel}.cif`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corpo)});
    if(r.ok) return {punti};
    if(r.status===401 || r.status===403) throw new ErroreGh("chiave");
    if(r.status!==409 && r.status!==422) throw new Error("GitHub: risposta "+r.status);
    /* 409/422: il file è cambiato nel frattempo (altro dispositivo): si rilegge e si riapplica. */
  }
  throw new Error("salvataggio non riuscito, riprova");
}
const chiaveGhHTML = ()=>`<form class="kp-key" data-kp-chiave>
  <span>${ghScaduta?"La chiave di GitHub è scaduta: creane una nuova.":"Una volta sola: poi su ogni dispositivo basta la password."}</span>

    <li>Repository access: <b>Only select repositories</b>, scegli <b>cruscotto-lavoro-dati</b></li>

/* Testo dei punti: righe a capo e **grassetto**. Si salva come testo semplice, si mostra con esc() + <b>/<br>. */
const kpTesto = t=>esc(t).replace(/\*\*([\s\S]+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
function daEditor(el){
  let out = "";
  const walk = (n, b)=>{ for(const c of n.childNodes){
    if(c.nodeType===3){ out += c.textContent.replace(/ /g," "); continue; }
    if(c.nodeType!==1) continue;
    if(c.nodeName==="BR"){ out += "\n"; continue; }
    const blocco = /^(DIV|P|LI)$/.test(c.nodeName), gr = /^(B|STRONG)$/.test(c.nodeName) || parseInt(c.style?.fontWeight)>=600 || c.style?.fontWeight==="bold";
    if(blocco && out && !out.endsWith("\n")) out += "\n";
    if(gr && !b){
      const prima = out; out = ""; walk(c, true);
      const m = out.match(/^(\s*)([\s\S]*?)(\s*)$/); out = prima + (m[2] ? `${m[1]}**${m[2]}**${m[3]}` : out);
    } else walk(c, b||gr);
  } };
  walk(el, false);
  return out.replace(/\*{4}/g,"").replace(/\n{3,}/g,"\n\n").trim();
}
/* Un punto = titolo (prima riga) + descrizione facoltativa (il resto). Stesso campo t di prima. */
function kpParti(t){
  const i = t.indexOf("\n");
  return {tit:(i<0?t:t.slice(0,i)).replace(/\*\*/g,"").trim(), desc:i<0?"":t.slice(i+1).trim()};
}
const kpEditor = (t, k="")=>{ const {tit, desc} = kpParti(t); return `<div class="kp-ed" data-kp-ed="${esc(k)}">

  <div class="kp-bar"><button type="button" class="kp-b" data-kp-bold aria-label="Grassetto"><b>B</b></button><span></span><button type="button" class="sbtn" data-kp-annulla>Annulla</button><button type="button" class="sbtn pri" data-kp-salva>Salva</button></div></div>`; };
const MATITA = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-4-4L4 16v4z"/></svg>`;
const FRECCIA = `<svg class="kp-fr" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
function kpVoce(p, scrive){

}
function kpHTML(st){
  const punti = st.punti||[], scrive = !CIFRATO || !!leggiGh();
  const attiva = `<button class="kp-link" data-kp-collega>${ghScaduta?"Chiave di GitHub scaduta: rinnovala":"Attiva la scrittura (una volta sola)"}</button>`;
  if(st.nonLetti && !punti.length) return `<div class="ph">Punti non letti: GitHub non risponde. Ricarica fra un minuto.</div>` + (scrive ? "" : attiva);
  let h = punti.length

  } else h += attiva;

}
async function initKeyPoints(c){
  const root = $("#app"), body = $("#kp-body");
  let st = {punti:[]};
  const mostra = ()=>{ if(body.isConnected) body.innerHTML = kpHTML(st); };
  const errore = err=>{
    if(err instanceof ErroreGh){ salvaGh(""); ghScaduta = true; mostra(); toast("La chiave di GitHub non vale più: rinnovala"); }
    else if(err instanceof ErroreChiave){ route(); }
    else toast(String(err.message||err));
  };
  /* Un errore momentaneo dell'archivio (es. 503 mentre GitHub ripubblica) non deve nascondere il riquadro:
     si ritenta una volta, poi si mostra comunque. La scrittura rilegge sempre dall'API, quindi non perde punti. */
  await prendiGh();
  const prova = async ()=>{ try{ return await leggiAppunti(c.id); } catch(err){ if(err instanceof ErroreGh){ salvaGh(""); ghScaduta = true; return leggiAppunti(c.id); } throw err; } };
  try{ st = await prova(); }
  catch(err){ await new Promise(r=>setTimeout(r,2000)); st = await prova().catch(()=>({punti:[], nonLetti:true})); }
  mostra();
  root.addEventListener("submit", async e=>{
    const f = e.target.closest("form"); if(!f || !body.contains(f)) return;
    e.preventDefault();
    const inp = f.querySelector("input"), bt = f.querySelector("button"), v = inp.value.trim();
    if(!v) return;
    bt.disabled = true;
    if(f.matches("[data-kp-chiave]")){
      if(!/^(github_pat_|ghp_)/.test(v)){ bt.disabled = false; inp.value = ""; toast("Questa non è una chiave di GitHub: inizia con github_pat_"); return; }
      const r = await ghApi("", {}, v).catch(()=>null);
      if(!r || !r.ok){ bt.disabled = false; toast("Questa chiave non apre l'archivio cruscotto-lavoro-dati"); return; }
      try{ await depositaGh(v); }catch(err){ bt.disabled = false; toast(String(err.message||err)); return; }
      salvaGh(v); ghScaduta = false; st = await leggiAppunti(c.id).catch(()=>st); mostra(); toast("Scrittura attiva, anche sugli altri dispositivi"); return;
    }
  });
  /* Editor: un punto alla volta, si apre al posto del punto (o in fondo per uno nuovo). */
  const apriEditor = (dove, t, k)=>{
    mostra();
    const el = k ? body.querySelector(`li[data-k="${CSS.escape(k)}"]`) : body.querySelector("[data-kp-nuovo]");
    if(!el) return;
    if(k){ el.classList.add("ed"); el.innerHTML = kpEditor(t, k); } else el.outerHTML = kpEditor("", "");
    const ti = body.querySelector(".kp-tin"); ti.focus(); ti.setSelectionRange(ti.value.length, ti.value.length);
  };
  const salva = async ed=>{
    const k = ed.dataset.kpEd, bt = ed.querySelector("[data-kp-salva]");
    const tit = ed.querySelector(".kp-tin").value.replace(/\s+/g," ").trim(), desc = daEditor(ed.querySelector(".kp-area"));
    if(!tit){ toast("Manca il titolo"); ed.querySelector(".kp-tin").focus(); return; }
    const t = desc ? `${tit}\n${desc}` : tit;
    bt.disabled = true;
    try{
      st = await scriviAppunti(c.id, p=> k ? p.map(q=>q.k===k ? {...q, t, d:OGGI} : q)
                                           : (p.length>=KP_MAX ? p : [...p, {k:Date.now().toString(36), t, d:OGGI}]));
      mostra(); toast(k ? "Punto modificato" : "Punto aggiunto");
    } catch(err){ bt.disabled = false; errore(err); }
  };
  root.addEventListener("mousedown", e=>{ if(e.target.closest("[data-kp-bold]")) e.preventDefault(); });
  root.addEventListener("keydown", e=>{
    const ed = e.target.closest?.(".kp-ed");
    if(ed){
      if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); salva(ed); }
      else if(e.key==="Escape"){ e.preventDefault(); mostra(); }
      else if(e.key==="Enter" && e.target.matches(".kp-tin")){ e.preventDefault(); ed.querySelector(".kp-area").focus(); }
      return;
    }
  });
  root.addEventListener("click", async e=>{
    if(!body.contains(e.target)) return;
    if(e.target.closest("[data-kp-collega]")){ e.target.closest("[data-kp-collega]").outerHTML = chiaveGhHTML(); body.querySelector("[data-kp-chiave] input").focus(); return; }
    if(e.target.closest("[data-kp-bold]")){ document.execCommand("bold"); return; }
    if(e.target.closest("[data-kp-annulla]")){ mostra(); return; }
    const ed = e.target.closest("[data-kp-salva]")?.closest(".kp-ed"); if(ed){ salva(ed); return; }
    if(e.target.closest("[data-kp-nuovo]")){ apriEditor(null, "", ""); return; }
    const ap = e.target.closest("[data-kp-apri]");
    if(ap){ const li = ap.closest("li"), o = li.classList.toggle("open"); ap.setAttribute("aria-expanded", o); return; }
    const m = e.target.closest("[data-kp-mod]");
    if(m && !e.target.closest("a")){ const k = m.closest("li").dataset.k; apriEditor(null, (st.punti.find(p=>p.k===k)||{}).t||"", k); return; }
    const x = e.target.closest("[data-kp-via]"); if(!x) return;
    x.disabled = true;
    try{ st = await scriviAppunti(c.id, p=>p.filter(q=>q.k!==x.dataset.kpVia)); mostra(); toast("Punto tolto"); }
    catch(err){ x.disabled = false; errore(err); }
  });
}

/* Campagne: dalle righe per campagna di risultati/<cliente>.csv. Attiva = ha speso negli ultimi 7 giorni. */
const PERIODI = [["30","Ultimi 30 giorni"],["mese","Questo mese"],["prima","Mese scorso"]];
function pannelloCampagne(c){
  if(!c.risultati) return `<section class="box"><h2>Campagne</h2>${inArrivo("I numeri delle campagne arriveranno da soli dalle piattaforme.")}</section>`;
  return `<div class="chips" role="group" aria-label="Periodo">${PERIODI.map(([k,l],i)=>`<button class="chip" data-per="${k}" aria-pressed="${i===0}">${l}</button>`).join("")}</div>
  <div id="camp-body" class="cpanel"></div>`;
}
const piuGiorni = (iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function campagneHTML(c, per){
  const righe = (D.risultati[c.id]||[]).filter(r=>r.c);
  if(!righe.length) return `<section class="box">${inArrivo("Per questo cliente non ci sono ancora numeri per campagna.")}</section>`;
  const fino = ultimoGiorno(righe);
  let da, a = fino;
  if(per==="mese") da = fino.slice(0,7)+"-01";
  else if(per==="prima"){ const p = new Date(fino.slice(0,7)+"-01T12:00:00"); p.setMonth(p.getMonth()-1); da = p.toISOString().slice(0,7)+"-01"; a = piuGiorni(fino.slice(0,7)+"-01",-1); }
  else da = piuGiorni(fino,-29);
  const kpi = (c.scheda||{}).kpi||[];
  const camp = {};
  righe.forEach(r=>{ (camp[r.c] ||= []).push(r); });
  const schede = Object.entries(camp).map(([nome, rr])=>{
    const met = [...new Set(rr.map(r=>r.m))].find(m=>!["spesa","clic","impression"].includes(m));
    const somma = m=>rr.filter(r=>r.m===m && r.g>=da && r.g<=a).reduce((s,r)=>s+r.v,0);
    const ultimaSpesa = rr.filter(r=>r.m==="spesa" && r.v>0).reduce((x,r)=>r.g>x?r.g:x,"");
    const attiva = ultimaSpesa && ultimaSpesa>=piuGiorni(fino,-6);
    const k = kpi.find(x=>x.metrica===met), nomeRis = k ? k.nome : (met||"Risultati").replace(/^./,s=>s.toUpperCase());
    const sp = somma("spesa"), ris = met ? somma(met) : 0;
    return {nome, attiva, ultimaSpesa, sp, ris, nomeRis, cpr: ris>0 ? sp/ris : null};
  }).sort((x,y)=>(y.attiva-x.attiva) || y.sp-x.sp);
  const card = s=>`<article class="cc${s.attiva?"":" ferma"}">
    <div class="cc-h"><b>${esc(s.nome)}</b><span class="pill ${s.attiva?"p-ok":"p-wait"}">${s.attiva?"attiva":"ferma"}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Spesa</div><div class="v num">${eur(s.sp)} €</div></div>
      <div class="kpi"><div class="l">${esc(s.nomeRis)}</div><div class="v num">${eur(s.ris, s.ris%1?1:0)}</div></div>
      <div class="kpi"><div class="l">Costo per risultato</div><div class="v num">${s.cpr==null?"nessuno":eur(s.cpr, s.cpr<10?2:0)+" €"}</div></div>
    </div>
    ${s.attiva?"":`<div class="cc-f">Ultima spesa il ${dm(s.ultimaSpesa)}</div>`}
  </article>`;
  const att = schede.filter(s=>s.attiva), fer = schede.filter(s=>!s.attiva);
  return `<section class="box"><div class="sec-h" style="margin-bottom:12px"><h2 class="pf-h">${esc(c.piattaforma||"Campagne")}</h2><span class="stato-dati">dal ${dm(da)} al ${dm(a)}</span></div>
    <div class="cards">${att.map(card).join("") || `<div class="ph">Nessuna campagna attiva.</div>`}</div>
    ${fer.length?`<div class="lab" style="margin:16px 0 8px">Ferme</div><div class="cards">${fer.map(card).join("")}</div>`:""}
  </section>`;
}

/* Variazioni: scegli la campagna, compaiono le sue righe, dalla più recente, divise per mese. */
function pannelloVariazioni(c){
  const v = c.variazioni||{stato:"in-arrivo"};
  if(v.stato!=="ok") return `<section class="box"><h2>Variazioni</h2>${inArrivo("Il registro di questo cliente non è ancora nel formato nuovo.")}</section>`;
  const ordine = []; v.righe.forEach(r=>{ if(!ordine.includes(r.camp)) ordine.push(r.camp); });
  return `<div class="chips" role="group" aria-label="Campagna">${ordine.map((k,i)=>`<button class="chip" data-camp="${esc(k)}" aria-pressed="${i===0}">${esc(k)}<span class="nn">${v.righe.filter(r=>r.camp===k).length}</span></button>`).join("")}</div>
  <section class="box"><div id="var-body">${variazioniCampagna(v.righe, ordine[0])}</div></section>`;
}
function variazioniCampagna(righe, camp){
  let h = "", mese = "";
  righe.filter(r=>r.camp===camp).forEach(r=>{
    const m = r.d.slice(0,7);
    if(m!==mese){ mese = m; h += `<div class="mese-h">${nomeMese(m)} ${m.slice(0,4)}</div>`; }
    h += rigaVar(r);
  });
  return h || `<div class="ph">Nessuna variazione registrata.</div>`;
}

/* To-do: il nome del cliente in testa alla voce ("Ceabis Google Ads: ...") diventa un'etichetta corta,
   il testo si ferma a poche righe e si apre toccandolo. Il testo della voce non si riscrive. */
function separa(t, nome){
  const m = String(t||"").match(/^([^:]{2,45}):\s*([\s\S]+)$/);
  if(m && m[1].toLowerCase().startsWith(nome.toLowerCase())){
    const tag = m[1].slice(nome.length).replace(/^[\s,-]+/,"").trim();
    return {tag, t:m[2].charAt(0).toUpperCase()+m[2].slice(1)};
  }
  return {tag:"", t:String(t||"")};
}
function quando(s){
  if(!s) return "";
  if(s<OGGI) return `<span class="qd late">scaduta ${dm(s)}</span>`;
  if(s===OGGI) return `<span class="qd oggi">oggi</span>`;
  return `<span class="qd">${dm(s)}</span>`;
}
function voceTodo(v, nome, att){
  const {tag, t} = separa(v.t, nome), lt = !att && late(v.s);
  const etich = `${tag?`<span class="ti-tag">${esc(tag)}</span>`:""}${v.dc?`<span class="tag dc">da confermare</span>`:""}`;
  const aspetta = att && v.a ? `<div class="ti-a">aspetta <b>${esc(v.a)}</b>${v.dal?` · ${giorni(v.dal)}`:""}</div>` : "";
  const data = att ? "" : quando(v.s);
  return `<li class="ti${lt?" late":""}" data-apri tabindex="0"><div class="ti-t">${esc(t)}</div>${data}${etich||aspetta?`<div class="ti-sub">${etich}${aspetta}</div>`:""}</li>`;
}
function listaTodo(list, nome, att){
  if(!list.length) return `<div class="ph">${att?"Niente in attesa.":"Niente da fare."}</div>`;
  const ul = l=>`<ul class="tl">${l.map(v=>voceTodo(v,nome,att)).join("")}</ul>`;
  if(att) return ul(list);
  const g = {"Scadute":[], "Entro 7 giorni":[], "Più avanti":[], "Senza data":[]}, fra7 = piuGiorni(OGGI,7);
  list.forEach(v=>g[!v.s?"Senza data":v.s<OGGI?"Scadute":v.s<=fra7?"Entro 7 giorni":"Più avanti"].push(v));
  return Object.entries(g).filter(([,l])=>l.length).map(([k,l])=>`<div class="grp-h${k==="Scadute"?" late":""}">${k}<span>${l.length}</span></div>${ul(l)}`).join("");
}

function initCliente(c, tab){
  const root = $("#app");
  if(tab==="campagne"){
    if(!c.risultati) return null;
    let per = "30";
    const draw = ()=>{ $("#camp-body").innerHTML = campagneHTML(c, per); };
    root.addEventListener("click", e=>{
      const b = e.target.closest("[data-per]"); if(!b) return;
      per = b.dataset.per; root.querySelectorAll("[data-per]").forEach(x=>x.setAttribute("aria-pressed", x===b)); draw();
    });
    draw(); return null;
  }
  if(tab==="variazioni"){
    root.addEventListener("click", e=>{
      const b = e.target.closest("[data-camp]"); if(!b) return;
      root.querySelectorAll("[data-camp]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      $("#var-body").innerHTML = variazioniCampagna(c.variazioni.righe, b.dataset.camp);
    });
    return null;
  }
  if(tab==="todo"){
    const apri = el=>el.classList.toggle("open");
    root.addEventListener("click", e=>{
      const v = e.target.closest("[data-apri]"); if(v) apri(v);
    });
    root.addEventListener("keydown", e=>{ const v = e.target.closest?.("[data-apri]"); if(v && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); apri(v); } });
    return null;
  }
  if(tab!=="risultati") return null;
  initKeyPoints(c);
  const kpi = (c.scheda||{}).kpi||[];
  if(!(c.risultati && kpi.length)) return null;
  const righe = D.risultati[c.id]||[];
  const mesi = mesiDa(righe);
  if(!mesi.length){ $("#chartC").innerHTML = `<div class="ph">Nessun dato ancora nell'archivio.</div>`; return null; }
  const parziale = mesi[mesi.length-1]===OGGI.slice(0,7);
  const fino = ultimoGiorno(righe);
  const chiuso = ultimoChiuso(mesi);
  const vars = (c.variazioni&&c.variazioni.stato==="ok") ? c.variazioni.righe : [];
  const marks = {}; vars.forEach(v=>{ const i = mesi.indexOf(v.d.slice(0,7)); if(i>=0) marks[i]=(marks[i]||0)+1; });
  $("#kpis").innerHTML = kpi.map(k=>{ const {vals} = serieKpi(c.id,k); return `<div class="kpi"><div class="l">${esc(k.nome)}, ${nomeMese(mesi[chiuso]).toLowerCase()}</div><div class="v num">${fmtKpi(k, vals[chiuso])}</div></div>`; }).join("");
  let met = 0, sel = chiuso, openMark = null;
  const draw = ()=>{
    const k = kpi[met], {vals} = serieKpi(c.id,k);
    const sc = scala(Math.max(0,...vals.filter(v=>v!=null)));
    barChart($("#chartC"), vals, mesi.map(m=>MESI[+m.slice(5,7)-1]), {...sc, sel, marks, openMark, parziale,
      aria:`${k.nome} mese per mese, da ${nomeMese(mesi[0]).toLowerCase()} a ${nomeMese(mesi[mesi.length-1]).toLowerCase()}`});
    const v = vals[sel], m = mesi[sel], inCorso = parziale && sel===mesi.length-1;
    $("#readout").innerHTML = v==null
      ? `${nomeMese(m)}: <b>n.d.</b>${k.dal?` (dato affidabile dal ${dm(k.dal)}/${k.dal.slice(2,4)})`:""}`
      : `${nomeMese(m)}${inCorso?`, fino al ${dm(fino)}`:""}: <b class="num">${fmtKpi(k,v)}</b> ${esc(k.nome.toLowerCase())}`;
  };
  const showPop = i=>{
    const rows = vars.filter(v=>v.d.slice(0,7)===mesi[i]), shown = rows.slice(0,4);
    $("#pop").innerHTML = `<div class="pop"><h3>${nomeMese(mesi[i])}: ${rows.length} ${rows.length===1?"variazione":"variazioni"}</h3>${shown.map(rigaVar).join("")}${rows.length>4?`<a class="more" style="display:block;text-align:center;text-decoration:none;color:inherit" href="#c/${c.id}/variazioni">Le altre ${rows.length-4} in Variazioni</a>`:""}</div>`;
  };
  draw();
  /* Ridisegna se la larghezza cambia dopo il primo disegno (font, barra di scorrimento, telefono ruotato). */
  let larg = $("#chartC").clientWidth;
  if(window.ResizeObserver) new ResizeObserver(()=>{ const el=$("#chartC"); if(el && el.clientWidth!==larg){ larg=el.clientWidth; draw(); } }).observe($("#chartC"));
  root.addEventListener("click", e=>{
    const mk = e.target.closest("[data-mark]");
    if(mk){ const i=+mk.dataset.mark; openMark = openMark===i?null:i; sel=i; draw(); if(openMark==null) $("#pop").innerHTML=""; else showPop(i); return; }
    const b = e.target.closest("[data-bar]");
    if(b){ sel=+b.dataset.bar; draw(); return; }
    const ch = e.target.closest("[data-met]");
    if(ch){ met=+ch.dataset.met; root.querySelectorAll("[data-met]").forEach(x=>x.setAttribute("aria-pressed", x===ch)); draw(); return; }
  });
  return draw;
}

function diagramma(){
  const N = (k,x,y,w,h,l,sub,cls="")=>{
    const cx = x+w/2, cy = y+h/2;
    return `<g class="n ${cls}" data-k="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>`+
      (sub ? `<text class="nl" x="${cx}" y="${cy-3}" text-anchor="middle">${l}</text><text class="ns" x="${cx}" y="${cy+12}" text-anchor="middle">${sub}</text>`
           : `<text class="nl" x="${cx}" y="${cy+4.5}" text-anchor="middle">${l}</text>`)+`</g>`;
  };
  const A = (k,x,y1,y2,lab="",lx=0,ly=0,anc="start",dbl=false)=>{
    const d = Math.sign(y2-y1), h = 7;
    const head = (yy,dd)=>`<polygon points="${x-4.5},${yy-dd*h} ${x+4.5},${yy-dd*h} ${x},${yy}"/>`;
    return `<g class="ar" data-k="${k}"><line x1="${x}" y1="${dbl?y1+d*h:y1}" x2="${x}" y2="${y2-d*h}"/>${head(y2,d)}${dbl?head(y1,-d):""}${lab?`<text x="${lx}" y="${ly}" text-anchor="${anc}">${lab}</text>`:""}</g>`;
  };
  return `<svg class="dg" id="dg" viewBox="-9 -2 378 502" role="img" aria-label="Telegram, riunioni, Claude e piattaforme scrivono in tre archivi: to-do di lavoro, variazioni, risultati. Il Cruscotto legge gli archivi e mostra Oggi e la scheda cliente; Oggi si stampa. TASS è la stanza del team, con una freccia in uscita e una in entrata. Il personale è a parte.">
  <g class="bg">
    <rect class="fr" x="-6" y="212" width="372" height="102" rx="10"/>
    <rect class="lg-bg" x="136" y="205" width="80" height="14"/>
    <text class="lg" x="176" y="216" text-anchor="middle">CRUSCOTTO</text>
    <rect class="sch" x="72" y="220" width="290" height="88" rx="7"/>
    <text class="sch-l" x="190" y="291">Scheda cliente</text>
  </g>
  ${N("tg",0,0,84,46,"Telegram","scrivi al bot")}
  ${N("riu",92,0,84,46,"Riunioni","riviste")}
  ${N("cl",184,0,84,46,"Claude","modifica")}
  ${N("plat",276,0,84,46,"Piattaforme","Google, Meta")}
  ${A("a-tg",42,48,98,"smista",48,78)}
  ${A("a-riu",134,48,98)}
  ${A("a-cl",226,48,98,"approvi",232,78)}
  ${A("a-plat",318,48,98,"da sole",324,78)}
  ${N("todo",0,100,176,44,"To-do di lavoro","archivio")}
  ${N("varA",184,100,84,44,"Variazioni","archivio")}
  ${N("risA",276,100,84,44,"Risultati","archivio")}
  ${A("a-oggi",35,146,224,"sistemi",41,182,"start",true)}
  ${A("a-passi",127,146,224)}
  ${A("a-var",226,146,224)}
  ${A("a-ris",318,146,224)}
  ${N("oggi",0,226,70,34,"Oggi","","c")}
  ${N("passi",78,226,98,34,"Prossimi passi","","c")}
  ${N("var",184,226,84,34,"Variazioni","","c")}
  ${N("ris",276,226,84,34,"Risultati","","c")}
  ${N("attesa",78,268,98,34,"In attesa","","c")}
  ${A("a-stampa",35,262,350)}
  ${N("stampa",0,352,70,44,"Stampa","foglio A4")}
  ${A("a-out",214,316,370,"passo a un collega",208,340,"end")}
  ${A("a-in",330,370,316,"vedo i loro task",324,357,"end")}
  ${N("tass",150,372,210,56,"TASS","stanza del team","dash")}
  <g class="bg pers"><rect x="0" y="452" width="124" height="44" rx="7"/><text class="pl" x="62" y="471" text-anchor="middle">Personale</text><text class="ps" x="62" y="486" text-anchor="middle">a parte</text></g>
  </svg>`;
}
function viewCome(){
  return `<div class="view">
  <div><h1>Come funziona</h1><div class="sub">Ogni casella legge da un solo archivio</div></div>
  <section class="box">
    <figure class="dg-fig" id="dgfig">
      <div class="dg-wrap">${diagramma()}</div>
      <div class="step" id="step" aria-live="polite"></div>
    </figure>
  </section>
  <section class="box">
    <h2>Prova un caso</h2>
    <div class="casi">${CASI.map((c,i)=>`<button class="caso" data-caso="${i}" aria-pressed="false">${c.t}</button>`).join("")}</div>
  </section>
  <section class="box">
    <h2>Cosa usi</h2>
    <ul class="uso">
      <li><b>Telegram</b><span>butti dentro</span></li>
      <li><b>Cruscotto</b><span>guardi e sistemi</span></li>
      <li><b>Claude</b><span>lavori</span></li>
    </ul>
    <div class="nota"><span>Solo lavoro. Il personale avrà una pagina sua.</span><span>TASS è del team: i tuoi to-do non ci entrano. Il legame si accende quando il team userà TASS.</span></div>
  </section>
  <section class="box">
    <h2>Quando si aggiorna</h2>
    <ul class="uso">
      <li><b>Risultati</b><span>ogni mattina, da soli, anche a Mac spento</span></li>
      <li><b>Il resto</b><span>dopo il foglio del mattino e quando lo chiedi a Claude</span></li>
    </ul>
    ${CIFRATO?`<div class="btns"><button class="sbtn dng" data-togli-chiave>Esci da questo dispositivo</button></div>`:""}
  </section>
  </div>`;
}
let comeT;
function initCome(){
  const root = $("#app"), dg = $("#dg"), step = $("#step");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ci = null, si = 0, auto = false;
  const show = ()=>{
    clearTimeout(comeT);
    dg.querySelectorAll("[data-k]").forEach(g=>g.classList.remove("on","now"));
    if(ci==null){ dg.classList.remove("play"); step.innerHTML = `<div class="tx idle">Scegli un caso qui sotto: il disegno si accende passo per passo.</div>`; return; }
    const c = CASI[ci];
    dg.classList.add("play");
    c.s.slice(0,si+1).forEach((st,i)=>st[0].forEach(k=>{ const g = dg.querySelector(`[data-k="${k}"]`); if(!g) return; g.classList.add("on"); if(i===si) g.classList.add("now"); }));
    step.innerHTML = `<div class="nb">${esc(c.t)} · passo ${si+1} di ${c.s.length}</div>
      <div class="nav"><button data-st="-1" aria-label="Passo precedente" ${si?"":"disabled"}>&#8249;</button><button data-st="1" aria-label="Passo successivo" ${si<c.s.length-1?"":"disabled"}>&#8250;</button></div>
      <div class="tx">${c.s[si][1]}</div>`;
    if(auto && si<c.s.length-1) comeT = setTimeout(()=>{ si++; show(); }, 2600);
  };
  show();
  root.addEventListener("click", e=>{
    if(e.target.closest("[data-togli-chiave]")){ salvaChiave(""); salvaGh(""); location.hash="#clienti"; location.reload(); return; }
    const b = e.target.closest("[data-caso]");
    if(b){
      ci = +b.dataset.caso; si = 0; auto = true;
      root.querySelectorAll("[data-caso]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      $("#dgfig").scrollIntoView({behavior:reduce?"auto":"smooth", block:"start"});
      show(); return;
    }
    const s = e.target.closest("[data-st]");
    if(s && ci!=null){ auto = false; si = Math.max(0, Math.min(CASI[ci].s.length-1, si + +s.dataset.st)); show(); }
  });
  return null;
}

/* ================= ROUTER ================= */
let redraw = null, giro = 0;
function monta(html){
  const old = $("#app"), fresh = old.cloneNode(false); old.replaceWith(fresh); fresh.innerHTML = html; return fresh;
}
function segnaTab(tab){
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
function mostraChiave(motivo){
  segnaTab(null); monta(viewChiave(motivo)); redraw = null;
  const f = $("#form-chiave"), b = f.querySelector("button");
  f.addEventListener("submit", async e=>{
    e.preventDefault(); const v = $("#in-chiave").value; if(!v) return;
    b.disabled = true; b.textContent = "Apro...";
    let k;
    try{ k = await apriConPassword(v); }
    catch(err){ if(err instanceof DOMException || err.name==="OperationError"){ mostraChiave("sbagliata"); return; } throw err; }
    salvaChiave(k, $("#in-ricorda").checked); CHIAVE = null;
    D.indice = null; D.clienti = {}; D.risultati = {}; route();
  });
  $("#in-chiave").focus();
}
async function route(){
  const mio = ++giro;
  clearTimeout(comeT);
  let key = (location.hash||"#clienti").slice(1);
  document.body.classList.toggle("stampa-oggi", key==="oggi");
  document.body.classList.remove("largo");
  try{
    if(!D.indice){
      monta(`<div class="view"><div class="ph">Carico i dati...</div></div>`);
      D.indice = await leggi("indice.json");
      if(!D.indice) throw new Error("indice.json mancante nell'archivio");
      OGGI = D.indice.oggi || OGGI;
      $("#data-oggi").textContent = dataLunga(OGGI);
      if(mio!==giro) return;
    }
    if(key.startsWith("c/")){
      let [id, tab] = key.slice(2).split("/");
      if(!CTABS.some(t=>t[0]===tab)) tab = "risultati";
      segnaTab("clienti");
      document.body.classList.add("largo");
      const c = await caricaCliente(id);
      if(mio!==giro) return;
      if(!c){ location.hash = "#clienti"; return; }
      monta(viewCliente(c, tab)); redraw = initCliente(c, tab);
    } else if(key==="oggi"){ segnaTab("oggi"); monta(viewOggi()); redraw = initOggi(); }
    else if(key==="posta"){ segnaTab("posta"); monta(viewVuota("Posta","Lavoro","Il report della posta arriva qui con la tappa 4. Per ora resta sulla Torre del Mac.","foglio/posta.json, scritto dal triage della posta.")); redraw = null; }
    else if(key==="automazioni"){ segnaTab("automazioni"); monta(viewVuota("Automazioni","Cosa gira al posto tuo","Lo stato delle automazioni arriva qui con la tappa 4. Per ora resta sulla Torre del Mac.","registro-automazioni.jsonl. Ogni automazione scrive una riga a fine giro.")); redraw = null; }
    else if(key==="come-funziona"){ segnaTab("come-funziona"); monta(viewCome()); redraw = initCome(); }
    else { segnaTab("clienti"); monta(viewClienti()); redraw = null; const d = await initClienti(); if(mio===giro) redraw = d; }
    window.scrollTo(0,0);
  } catch(err){
    if(mio!==giro) return;
    if(err instanceof ErroreChiave){ mostraChiave(err.message); return; }
    monta(`<div class="view"><section class="box"><h2>Dati non disponibili</h2><div class="ph">${esc(err.message||err)}. Riprova fra poco o ricarica la pagina.</div></section></div>`);
  }
}
window.addEventListener("hashchange", route);
let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(()=>redraw&&redraw(),120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>redraw&&redraw());
route();
</script>
